<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phantasm probe</title>
<style>
  html, body { margin: 0; background: transparent; color: #eee; font: 13px/1.3 sans-serif; overflow: hidden; }
  .card { margin: 6px; padding: 8px; background: rgba(12, 12, 16, 0.72); border: 1px solid rgba(255, 255, 255, 0.18);
          border-radius: 6px; display: inline-block; }
  .frame { position: relative; width: 360px; height: 480px; }
  .pic { width: 100%; height: 100%; display: block; background: rgba(255, 255, 255, 0.04); object-fit: fill; }
  .aim { position: absolute; width: 21px; height: 21px; margin: -10px 0 0 -10px; pointer-events: none;
         opacity: 0; transition: opacity 0.6s; }
  .aim.on { opacity: 0.9; transition: none; }
  .aim::before, .aim::after { content: ''; position: absolute; background: #fd4; box-shadow: 0 0 2px #000; }
  .aim::before { left: 10px; top: 0; width: 1px; height: 21px; }
  .aim::after { left: 0; top: 10px; width: 21px; height: 1px; }
  .status { margin-top: 6px; font-size: 12px; opacity: 0.85; word-break: break-all; }
  .keys { margin-top: 2px; font-size: 11px; opacity: 0.6; }
</style>
</head>
<body>
<div class="card">
  <div id="frame" class="frame">
    <img id="pic" class="pic" alt="">
    <div id="aim" class="aim" style="left: 50%; top: 50%"></div>
  </div>
  <div id="status" class="status">waiting for Phantasm</div>
  <div class="keys">Alt+F7 size &middot; Num +/- zoom &middot; Num 8/2/4/6 aim &middot; Num 7/9 turn &middot;
    Num 1/3 tilt &middot; Num 5 reset</div>
</div>
<script>
  // Called by PhantasmProbe.dll (InvokeJS). The image keeps its URL for the process; Magelight repaints it when
  // Phantasm invalidates it, so the src is set once per Shown.
  window.probeShow = function (url, name, w, h) {
    var pic = document.getElementById('pic');
    if (pic.getAttribute('src') !== url) pic.setAttribute('src', url);
    document.getElementById('status').textContent = name + ' ' + w + 'x' + h;
  };
  window.probeStatus = function (text) {
    document.getElementById('status').textContent = text;
  };
  // The picture's size in CSS px, which the DLL also opens the view at (the page runs at device scale 1).
  window.probeLayout = function (w, h) {
    var frame = document.getElementById('frame');
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  };
  // The point a zoom goes toward, 0..1 from the top left; shown briefly after each move.
  var aimTimer = 0;
  window.probeAim = function (u, v) {
    var aim = document.getElementById('aim');
    aim.style.left = (u * 100) + '%';
    aim.style.top = (v * 100) + '%';
    aim.className = 'aim on';
    clearTimeout(aimTimer);
    aimTimer = setTimeout(function () { aim.className = 'aim'; }, 1200);
  };
</script>
</body>
</html>
