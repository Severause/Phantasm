; Phantasm settings, read when the game loads its data. The settings pages in the game ([SettingsPage], at the end)
; change them while it runs and write them back here; the comments stay.

[LiveViews]
; How much of each frame the live views may take (a page with several views, such as a four-panel lineup). The
; budget is per kind of view: actor views and item views each get it.
;   smooth   - every view of a typical page draws every frame while the game is paused (about 14 ms of CPU a frame
;              for the views; 4 on VR), and balanced's budget while the game runs. The default.
;   balanced - 6 ms (3 on VR): the newest view draws every frame, the others take turns. Phantasm 0.4.0's budget.
;   light    - 3 ms (1.5 on VR): for a machine where the views cost the game's frame rate.
Budget = smooth
; A number of milliseconds replaces the mode's budget (0.5 to 50); 0 keeps the mode's.
BudgetMs = 0

[NeuralRendering]
; Experimental. The pictures mods ask Phantasm to take of a character go through NVIDIA DLSS NR (DLSS 5's neural
; rendering), run from the nvngx_dlssnr.dll you already have, inside the game (PhantasmNRInProc.dll in
; SKSE/Plugins/Phantasm). It starts while the game loads to its main menu, works from a copy of the library of its own
; (150 to 300 MB under %LOCALAPPDATA%\Phantasm\NR), keeps other programs' Vulkan overlays and capture hooks out of
; the game, and keeps several hundred MB of the game's memory for the rest of the session. If a library it loads is
; slow to start, the game waits for it; Phantasm.log names the library.
; 1 turns it on, 0 off. Turned on while the game runs (a settings page), it starts then, and the game may wait a
; few seconds while it does.
Enabled = 0
; Where its library comes from. A change made after neural rendering has looked for it waits for the next start of
; the game.
;   Folder = auto     the copy your neural rendering mod installed: the one it has loaded, else the first found under
;                     Data/SKSE/Plugins, Data/Shaders or the game's folder (a copy under the mod's own file name
;                     counts, such as Theo's Render Pipeline's nvngx_dlssnr_int8.dll)
;   Folder = <path>   the folder that holds the copy to use, or the library file itself (any nvngx_dlssnr*.dll);
;                     in "quotes" when the path has a ; or a # in it
;   Folder =          none: neural rendering stays off whatever Enabled says
Folder = auto
; An NVIDIA-signed copy runs through NVIDIA's own loader, on the GPUs it was made for (RTX 50). An unsigned copy (a
; community build for an older GPU, a pre-release one) is loaded directly: 1 allows that, 0 refuses such copies.
Unsigned = 1
; Whose settings NR takes: 1 those you set in the mod the copy belongs to (its own NR switch, style and strengths:
; Skyrim Upscaler, Theo's Render Pipeline, Open Shaders), read again whenever that mod saves them; 0 the ones below.
; With 1 the ones below still stand for anything the mod does not set, and when the copy belongs to none of them.
Follow = 1
; NVIDIA's model: 0, 1 or 2 (their A, B, C). Each strength is 0 to 1.
Model = 1
Intensity = 1.0
Tone = 1.0
Structure = 1.0
Skin = 1.0
; How many times NR runs over the picture (1 to 8).
Passes = 4
; Also the live views of characters (the Outfits mirror and other pages): 1 on, 0 off. Costs a few milliseconds
; of GPU time each frame such a view draws.
LiveViews = 1
; The size NR works at against the view's own supersampled picture, 0.25 to 1 (0.5 = about the size shown).
LiveScale = 0.5
; Only when NR could not start with the game because the mod it follows had its own NR switched off: 1 starts it as
; soon as you turn NR on in that mod; 0 at the first picture after that, which then comes a few seconds late (a
; live view shows as drawn meanwhile).
Prestart = 1

[SettingsPage]
; Where these settings are changed in the game:
;   SKSE Menu Framework   its Mod Control Panel, Phantasm > Settings
;   Magelight UI          the page this key opens: a DirectInput scan code (70 is Scroll Lock), or 0 for no key.
;                         Either page changes the key, at once; one typed here is read when the game starts.
Key = 70
